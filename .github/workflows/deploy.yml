name: Deploy Docusaurus to GitHub Pages

on:
  push:
    branches:
      - feat/initial-book-setup # Only deploy from the main branch
  workflow_dispatch: # Allows manual trigger

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20 # Use Node.js 20 as specified in plan.md (LTS version)

      - name: Install dependencies
        run: npm install
        working-directory: ./my-book # Docusaurus project is in my-book/

      - name: Build Docusaurus website
        run: npm run build
        working-directory: ./my-book

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./my-book/build # Docusaurus build output directory
          publish_branch: gh-pages
